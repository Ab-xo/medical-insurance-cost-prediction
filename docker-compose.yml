version: "3.9"

services:
  # ── FastAPI ML backend ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: medpredict-api
    ports:
      - "8000:8000"
    volumes:
      # Mount outputs so generated plots are served live
      - ./outputs:/app/outputs
      # Mount models so a retrain outside Docker is picked up
      - ./models:/app/models
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Next.js dashboard ───────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medpredict-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Point the dashboard at the API container by service name
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: medpredict-network
